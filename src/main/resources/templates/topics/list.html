<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::content})}">
<head>
    <title>Topics - QuizHub</title>
</head>
<body>
<div th:fragment="content">
    <div class="space-y-6">
        <!-- 1. Header & Actions Bar -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 tracking-tight">Topics & Categories</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Knowledge domains, syllabus coverage, and question counts.</p>
            </div>
            <div sec:authorize="hasRole('ADMIN')">
                <button onclick="openAddTopicModal()" type="button"
                        class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm transition-all">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                    <span>New Topic</span>
                </button>
            </div>
        </div>

        <!-- 2. Topics Cards Grid (12px rounded cards with rich visual details) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="card : ${topicCards}"
                 class="bg-white dark:bg-[#131b2e] rounded-xl border border-slate-200/80 dark:border-slate-800 p-6 shadow-sm flex flex-col justify-between hover:shadow-md hover:border-indigo-500/40 transition-all group">
                <div>
                    <div class="flex items-start justify-between gap-3">
                        <div class="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-950/80 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold text-base shadow-sm group-hover:scale-105 transition-transform">
                            <span class="material-symbols-outlined text-[24px]">category</span>
                        </div>
                        <div class="flex items-center gap-1.5" sec:authorize="hasRole('ADMIN')">
                            <button th:data-id="${card.topic.id}"
                                    th:data-name="${card.topic.name}"
                                    th:data-description="${card.topic.description}"
                                    onclick="openEditTopicModal(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-description'))"
                                    type="button" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 rounded-lg transition-colors" title="Edit Topic">
                                <span class="material-symbols-outlined text-[18px]">edit</span>
                            </button>
                            <form th:action="@{'/topics/' + ${card.topic.id} + '/delete'}" method="post" class="inline" onsubmit="return confirm('Are you sure you want to delete this topic and all its questions?');">
                                <button type="submit" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-lg transition-colors" title="Delete Topic">
                                    <span class="material-symbols-outlined text-[18px]">delete</span>
                                </button>
                            </form>
                        </div>
                    </div>

                    <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100 mt-4" th:text="${card.topic.name}">Topic Name</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 min-h-[32px]" th:text="${card.topic.description}">Topic description goes here explaining domain coverage.</p>

                    <!-- Difficulty Tiers Breakdown -->
                    <div class="flex flex-wrap gap-1.5 mt-4">
                        <span class="px-2.5 py-0.5 rounded-full bg-teal-50 dark:bg-teal-950/80 text-teal-700 dark:text-teal-300 text-[11px] font-medium border border-teal-200/60 dark:border-teal-800/60"
                              th:text="'Easy: ' + ${card.easyCount}">Easy: 4</span>
                        <span class="px-2.5 py-0.5 rounded-full bg-amber-50 dark:bg-amber-950/80 text-amber-700 dark:text-amber-300 text-[11px] font-medium border border-amber-200/60 dark:border-amber-800/60"
                              th:text="'Med: ' + ${card.mediumCount}">Med: 4</span>
                        <span class="px-2.5 py-0.5 rounded-full bg-red-50 dark:bg-red-950/80 text-red-700 dark:text-red-300 text-[11px] font-medium border border-red-200/60 dark:border-red-800/60"
                              th:text="'Hard: ' + ${card.hardCount}">Hard: 2</span>
                    </div>
                </div>

                <!-- Footer Stats & Actions -->
                <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800/80">
                    <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 mb-2">
                        <span class="font-medium" th:text="${card.totalQuestions + ' Total Questions'}">10 Total Questions</span>
                        <span class="font-semibold text-indigo-600 dark:text-indigo-400" th:text="${card.activeQuizzesCount + ' Live Quizzes'}">2 Live Quizzes</span>
                    </div>
                    <div class="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-2 overflow-hidden">
                        <div class="bg-indigo-600 dark:bg-indigo-500 h-2 rounded-full transition-all duration-500" th:style="'width: ' + ${card.completionPercentage} + '%'"></div>
                    </div>

                    <div class="mt-4 flex items-center gap-2">
                        <a th:href="@{'/questions?topicId=' + ${card.topic.id}}"
                           class="flex-1 py-2 text-center text-xs font-semibold rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                            View Questions
                        </a>
                        <a th:href="@{'/quizzes?topicId=' + ${card.topic.id}}"
                           class="flex-1 py-2 text-center text-xs font-semibold rounded-xl bg-indigo-50 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-indigo-900 transition-colors">
                            Browse Quizzes
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Topic Modal -->
    <div id="topicModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-[#131b2e] rounded-2xl border border-slate-200 dark:border-slate-800 max-w-md w-full p-6 shadow-2xl">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
                <h3 id="topicModalTitle" class="text-lg font-bold text-slate-900 dark:text-slate-100">Add Topic</h3>
                <button onclick="closeTopicModal()" type="button" class="text-slate-400 hover:text-slate-600">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>

            <form id="topicForm" th:action="@{/topics}" method="post" class="mt-4 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Topic Name</label>
                    <input id="topicName" name="name" type="text" required placeholder="e.g. Science, Mathematics"
                           class="w-full h-10 px-3 bg-slate-50 dark:bg-[#1a233b] border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20 text-slate-900 dark:text-slate-100">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Description</label>
                    <textarea id="topicDescription" name="description" rows="3" placeholder="Brief summary of topic..."
                              class="w-full p-3 bg-slate-50 dark:bg-[#1a233b] border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20 text-slate-900 dark:text-slate-100"></textarea>
                </div>

                <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-3">
                    <button onclick="closeTopicModal()" type="button"
                            class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</button>
                    <button type="submit"
                            class="px-5 py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition-all">Save Topic</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openAddTopicModal() {
            document.getElementById('topicModalTitle').innerText = 'Add New Topic';
            document.getElementById('topicForm').action = '/topics';
            document.getElementById('topicName').value = '';
            document.getElementById('topicDescription').value = '';
            document.getElementById('topicModal').classList.remove('hidden');
        }

        function openEditTopicModal(id, name, desc) {
            document.getElementById('topicModalTitle').innerText = 'Edit Topic';
            document.getElementById('topicForm').action = '/topics/' + id;
            document.getElementById('topicName').value = name;
            document.getElementById('topicDescription').value = desc || '';
            document.getElementById('topicModal').classList.remove('hidden');
        }

        function closeTopicModal() {
            document.getElementById('topicModal').classList.add('hidden');
        }
    </script>
</div>
</body>
</html>
