<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - QuizHub' : 'QuizHub - Online Quiz Management System'}">QuizHub</title>

    <!-- Google Fonts Inter & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        };
        // Instant Theme Application
        if (localStorage.getItem('quizhub-theme') === 'dark' || (!localStorage.getItem('quizhub-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <script th:src="@{/js/app.js}"></script>
</head>
<body class="bg-[#f8f9ff] dark:bg-[#0b1326] text-slate-900 dark:text-slate-100 min-h-screen antialiased">
    <!-- Sidebar Fragment -->
    <div th:replace="~{layout/sidebar :: sidebar(${activeNav})}"></div>

    <!-- Main Container -->
    <div class="pl-64 flex flex-col min-h-screen">
        <!-- Top Header Fragment -->
        <div th:replace="~{layout/header :: header}"></div>

        <!-- Main Content Area -->
        <main class="flex-1 pt-20 px-8 pb-12">
            <!-- Global Flash Messages -->
            <div th:if="${successMessage}" class="mb-6 p-4 rounded-xl bg-teal-50 dark:bg-teal-950/60 border border-teal-200 dark:border-teal-800/80 text-teal-800 dark:text-teal-200 flex items-center justify-between shadow-sm animate-fade-in">
                <div class="flex items-center gap-2.5">
                    <span class="material-symbols-outlined text-teal-600 dark:text-teal-400 text-[22px]">check_circle</span>
                    <span class="text-sm font-medium" th:text="${successMessage}">Operation successful!</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-teal-600 dark:text-teal-400 hover:opacity-75">
                    <span class="material-symbols-outlined text-[18px]">close</span>
                </button>
            </div>

            <div th:if="${errorMessage}" class="mb-6 p-4 rounded-xl bg-red-50 dark:bg-red-950/60 border border-red-200 dark:border-red-800/80 text-red-800 dark:text-red-200 flex items-center justify-between shadow-sm animate-fade-in">
                <div class="flex items-center gap-2.5">
                    <span class="material-symbols-outlined text-red-600 dark:text-red-400 text-[22px]">error</span>
                    <span class="text-sm font-medium" th:text="${errorMessage}">An error occurred!</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-red-600 dark:text-red-400 hover:opacity-75">
                    <span class="material-symbols-outlined text-[18px]">close</span>
                </button>
            </div>

            <!-- Page Body Injection -->
            <div th:replace="${content}"></div>
        </main>
    </div>
</body>
</html>
