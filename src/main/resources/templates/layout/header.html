<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="fixed top-0 left-64 right-0 h-16 bg-white/90 dark:bg-[#131b2e]/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 z-40 flex items-center justify-between px-8 shadow-sm">
    <!-- Global Search Input -->
    <div class="flex-1 max-w-md pr-6">
        <form th:action="@{/search}" method="get" class="relative flex items-center w-full">
            <span class="material-symbols-outlined absolute left-3.5 text-slate-400 pointer-events-none text-[20px]">search</span>
            <input id="global-search-input" name="q" th:value="${searchQuery}"
                   class="w-full h-10 pl-10 pr-4 bg-slate-100 dark:bg-[#1a233b] text-slate-900 dark:text-slate-100 placeholder:text-slate-400 text-sm rounded-xl outline-none focus:ring-2 focus:ring-indigo-500/30 border border-transparent focus:border-indigo-500 transition-all"
                   placeholder="Search quizzes, questions..." type="text"/>
        </form>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-4">
        <!-- Theme Toggle Button with clear visual pill -->
        <button onclick="toggleTheme()" type="button" aria-label="Toggle Theme" title="Toggle Light / Dark Mode"
                class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shadow-sm transition-all active:scale-95 text-xs font-semibold">
            <!-- Light mode icon shown when dark -->
            <span class="material-symbols-outlined hidden dark:inline text-amber-400 text-[18px]">light_mode</span>
            <span class="hidden dark:inline">Light Mode</span>
            <!-- Dark mode icon shown when light -->
            <span class="material-symbols-outlined dark:hidden text-indigo-600 text-[18px]">dark_mode</span>
            <span class="dark:hidden">Dark Mode</span>
        </button>

        <div class="h-5 w-px bg-slate-200 dark:bg-slate-800"></div>

        <!-- Current User Info -->
        <div class="flex items-center gap-2.5 pl-1">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-indigo-400 text-white font-semibold flex items-center justify-center text-xs shadow-sm">
                <span th:text="${#authentication.name != null ? #strings.substring(#authentication.name,0,1).toUpperCase() : 'U'}">A</span>
            </div>
            <div class="hidden sm:block text-left">
                <span class="block text-xs font-semibold text-slate-900 dark:text-slate-100 leading-tight" th:text="${#authentication.name}">admin@quizhub.com</span>
                <span class="block text-[11px] text-slate-400" th:text="${#authorization.expression('hasRole(''ADMIN'')') ? 'Administrator' : 'Student'}">Administrator</span>
            </div>
        </div>
    </div>
</header>
</body>
</html>
