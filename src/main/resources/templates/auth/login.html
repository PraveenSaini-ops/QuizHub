<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuizHub</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        };
    </script>
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <script th:src="@{/js/app.js}"></script>
</head>
<body class="bg-[#f8f9ff] dark:bg-[#0b1326] text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">
    <!-- Theme Toggle top right -->
    <div class="fixed top-6 right-6">
        <button onclick="toggleTheme()" type="button" class="p-2.5 rounded-xl bg-white dark:bg-[#131b2e] border border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 shadow-sm transition-colors">
            <span class="material-symbols-outlined dark:hidden text-[20px]">dark_mode</span>
            <span class="material-symbols-outlined hidden dark:inline text-[20px]">light_mode</span>
        </button>
    </div>

    <div class="w-full max-w-md">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 mb-4">
                <span class="material-symbols-outlined text-[32px]">quiz</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Welcome to QuizHub</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Online Assessment & Quiz Management System</p>
        </div>

        <!-- Card Container -->
        <div class="bg-white dark:bg-[#131b2e] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-8 shadow-[0_4px_20px_-2px_rgba(0,0,0,0.05)] dark:shadow-none">
            <!-- Flash Message Alerts -->
            <div th:if="${errorMessage}" class="mb-5 p-3.5 rounded-xl bg-red-50 dark:bg-red-950/60 border border-red-200 dark:border-red-800/80 text-red-700 dark:text-red-300 text-sm flex items-center gap-2">
                <span class="material-symbols-outlined text-[20px]">error</span>
                <span th:text="${errorMessage}">Invalid credentials.</span>
            </div>
            <div th:if="${logoutMessage}" class="mb-5 p-3.5 rounded-xl bg-teal-50 dark:bg-teal-950/60 border border-teal-200 dark:border-teal-800/80 text-teal-700 dark:text-teal-300 text-sm flex items-center gap-2">
                <span class="material-symbols-outlined text-[20px]">check_circle</span>
                <span th:text="${logoutMessage}">Logged out successfully.</span>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-4" autocomplete="off">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3.5 top-2.5 text-slate-400 text-[20px]">mail</span>
                        <input id="username" name="username" type="email" required
                               placeholder="you@example.com"
                               autocomplete="off"
                               class="w-full h-11 pl-11 pr-4 bg-slate-50 dark:bg-[#1a233b] border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3.5 top-2.5 text-slate-400 text-[20px]">lock</span>
                        <input id="password" name="password" type="password" required
                               placeholder="••••••••"
                               autocomplete="new-password"
                               class="w-full h-11 pl-11 pr-4 bg-slate-50 dark:bg-[#1a233b] border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 text-sm outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition-all">
                    </div>
                </div>

                <button type="submit"
                        class="w-full h-11 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold text-sm rounded-xl shadow-md shadow-indigo-500/20 transition-all flex items-center justify-center gap-2 mt-2">
                    <span>Sign In</span>
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </form>

            <!-- Quick Demo Accounts -->
            <div class="mt-6 pt-6 border-t border-slate-100 dark:border-slate-800">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 text-center">Quick Demo 1-Click Login</p>
                <div class="grid grid-cols-2 gap-2.5">
                    <button type="button" onclick="fillCredentials('student@quizhub.com', 'student123')"
                            class="p-3 rounded-xl border border-teal-200/80 dark:border-teal-800/80 bg-teal-50/50 dark:bg-teal-950/40 hover:bg-teal-100/60 dark:hover:bg-teal-900/60 transition-all text-left group">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-teal-700 dark:text-teal-300">Student</span>
                            <span class="material-symbols-outlined text-[16px] text-teal-600 dark:text-teal-400 group-hover:translate-x-0.5 transition-transform">login</span>
                        </div>
                        <div class="mt-1">
                            <span class="text-xs font-semibold text-slate-800 dark:text-slate-200 block">Alex Mercer</span>
                            <span class="text-[11px] text-slate-500 dark:text-slate-400 block font-mono">student@quizhub.com</span>
                            <span class="text-[10px] text-teal-600 dark:text-teal-400 font-mono block mt-0.5">pass: student123</span>
                        </div>
                    </button>

                    <button type="button" onclick="fillCredentials('admin@quizhub.com', 'admin123')"
                            class="p-3 rounded-xl border border-indigo-200/80 dark:border-indigo-800/80 bg-indigo-50/50 dark:bg-indigo-950/40 hover:bg-indigo-100/60 dark:hover:bg-indigo-900/60 transition-all text-left group">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-indigo-700 dark:text-indigo-300">Instructor / Admin</span>
                            <span class="material-symbols-outlined text-[16px] text-indigo-600 dark:text-indigo-400 group-hover:translate-x-0.5 transition-transform">login</span>
                        </div>
                        <div class="mt-1">
                            <span class="text-xs font-semibold text-slate-800 dark:text-slate-200 block">Prof. Eleanor Vance</span>
                            <span class="text-[11px] text-slate-500 dark:text-slate-400 block font-mono">admin@quizhub.com</span>
                            <span class="text-[10px] text-indigo-600 dark:text-indigo-400 font-mono block mt-0.5">pass: admin123</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCredentials(email, password) {
            const userField = document.getElementById('username');
            const passField = document.getElementById('password');
            if (userField && passField) {
                userField.value = email;
                passField.value = password;
                userField.form.submit();
            }
        }
    </script>
</body>
</html>
